                switch(face) {

                        windowMesh.position.set(offsetX, offsetY, buildingData.depth/2);
                        break;
                    case 1: // Back
                        windowMesh.position.set(offsetX, offsetY, -buildingData.depth/2);
                        break;
                    case 2: // Right
                        windowMesh.position.set(buildingData.width/2, offsetY, offsetZ);
