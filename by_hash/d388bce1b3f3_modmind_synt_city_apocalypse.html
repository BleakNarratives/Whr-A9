<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ MODMIND / EQUINEX UNIVERSAL HUB ⚡</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #00ff44;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            cursor: default;
        }
        #app { width: 100vw; height: 100vh; position: relative; }
        
        /* HUD STYLES - keeping your existing styling */
        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.85); padding: 15px;
            border: 2px solid #00ff44; border-radius: 10px; min-width: 280px;
            backdrop-filter: blur(5px); box-shadow: 0 0 15px rgba(0, 255, 68, 0.5);
        }
        #detail-panel {
            position: absolute; top: 50%; right: 10px; transform: translateY(-50%); z-index: 100;
            background: rgba(0, 0, 0, 0.95); padding: 20px; border: 2px solid #00ffff; border-radius: 12px;
            max-width: 350px; backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            display: none;
        }
        .hud-title { font-size: 18px; font-weight: bold; color: #ff4444; margin-bottom: 10px; text-align: center; }
        .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .metric-item { background: rgba(0, 0, 0, 0.7); padding: 8px; border-radius: 5px; border-left: 3px solid #00ff44; }
        .metric-label { font-size: 10px; opacity: 0.7; text-transform: uppercase; }
        .metric-value { font-size: 18px; font-weight: bold; color: #00ffff; }
        .monster-list-item { background: rgba(255, 68, 68, 0.1); padding: 8px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #ff4444; }
        .agent-swarm-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-top: 10px; }
        .swarm-btn { background: #ffaa00; color: #0a0a0a; border: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }
        .syntax-ai-btn { grid-column: span 2; background: #4400ff; color: #fff; padding: 10px; margin-top: 10px; border-radius: 6px; font-size: 12px; animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(68, 0, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(68, 0, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(68, 0, 255, 0); }
        }
        #in-game-alerts { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column-reverse; align-items: center; }
        .alert-message { margin-top: 10px; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.5s, transform 0.5s; }
    </style>
</head>
<body>
    <div id="app">
        <!-- HUD -->
        <div id="hud">
            <div class="hud-title">⚡ MODMIND / EQUINEX ⚡</div>
            <div class="hud-subtitle">CLIENT-SIDE FREEDOM HUB</div>

            <div class="metric-grid">
                <div class="metric-item">
                    <div class="metric-label">Total Modules</div>
                    <div class="metric-value" id="fileCount">0</div>
                </div>
                <div class="metric-item">
                    <div class="metric-label">Active Threats</div>
                    <div class="metric-value" id="monsterCount">0</div>
                </div>
                <div class="metric-item">
                    <div class="metric-label">Online Users</div>
                    <div class="metric-value" id="userCount">1</div>
                </div>
                <div class="metric-item">
                    <div class="metric-label">System Health</div>
                    <div class="metric-value" id="healthIndex">100%</div>
                </div>
            </div>
            
            <div style="background: #1a1a2e; color: #00ffff; padding: 5px; border-radius: 5px; text-align: center; font-size: 10px; margin-top: 10px;">
                <span id="auth-status">🟢 CLIENT-SIDE MODE: No Vendor Lock-in</span>
            </div>

            <div id="gap-alert" style="background: #00ff44; color: #0a0a0a; padding: 10px; border-radius: 8px; text-align: center; font-size: 10px; font-weight: bold; margin-top: 10px;">
                ✅ FREEDOM ACHIEVED: Zero Firestore Dependencies
            </div>
        </div>

        <!-- DETAIL PANEL -->
        <div id="detail-panel">
            <div class="hud-title" id="panel-title">MODULE DETAIL</div>
            <div class="metric-label" id="panel-metrics">LOC: 0 | Complexity: 0 | Health: 0%</div>
            <hr style="border-color:#00ffff; margin: 10px 0;">
            
            <div class="security-label">ACTIVE THREAT SIGNATURES (<span id="threat-count">0</span>)</div>
            <div id="monster-list"></div>
            
            <div id="agent-deployment-area" style="margin-top: 15px;">
                <div class="security-label" style="color:#00ff44;">DEPLOY AGENT SWARM</div>
                <div class="agent-swarm-container" id="agent-buttons"></div>
                
                <button class="syntax-ai-btn" id="syntax-ai-button" data-building-id="">
                    ⚡ DEPLOY SYNTAX AI (Full Module Fix) ⚡
                </button>
            </div>
            
            <button class="swarm-btn" style="grid-column: span 2; background:#ff4444; color:#0a0a0a; margin-top:10px;" onclick="closeDetailPanel()">CLOSE PANEL</button>
        </div>
        
        <!-- Game Alerts -->
        <div id="in-game-alerts"></div>
    </div>

    <script>
        // ========== CLIENT-SIDE PERSISTENCE ENGINE ==========
        class ModMindPersistence {
            constructor() {
                this.STORAGE_KEY = 'modmind_city_state';
                this.SYNC_TRIGGER_KEY = 'modmind_sync_pulse';
                this.userId = this.generateUserId();
                this.state = this.loadInitialState();
                this.setupCrossTabSync();
                this.startSyncPulse();
                
                console.log(`🆔 User ${this.userId} joined the shared city`);
            }
            
            generateUserId() {
                let userId = localStorage.getItem('modmind_user_id');
                if (!userId) {
                    userId = 'user_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('modmind_user_id', userId);
                }
                return userId;
            }
            
            loadInitialState() {
                const saved = localStorage.getItem(this.STORAGE_KEY);
                if (saved) {
                    return JSON.parse(saved);
                }
                
                // Genesis state - no Firestore needed!
                return {
                    buildings: this.generateInitialBuildings(),
                    users: { [this.userId]: { lastSeen: Date.now(), active: true } },
                    lastUpdated: Date.now(),
                    version: '1.0'
                };
            }
            
            generateInitialBuildings() {
                const filepaths = [
                    '/core/auth.js', '/api/users.py', '/ui/dashboard.html', 
                    '/styles/main.css', '/database/schema.sql', '/utils/crypto.ts',
                    '/config/env.json', '/tests/unit.py', '/agents/modmind.ts',
                    '/equilex/policy.md', '/vibe/coder.js', '/modmind/kernel.js'
                ];
                
                return filepaths.map(path => {
                    const id = 'file_' + Math.abs(path.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0));
                    const loc = 50 + Math.floor(Math.random() * 500);
                    const complexity = Math.min(20, loc / 50 + Math.random() * 5);
                    const position = this._hash_to_pos(path);
                    
                    // Add some initial chaos
                    const monsters = [];
                    for (let i = 0; i < Math.floor(Math.random() * 2) + 1; i++) {
                        monsters.push(this._generate_monster(id));
                    }
                    
                    return {
                        id,
                        filepath: path,
                        loc,
                        complexity: parseFloat(complexity.toFixed(2)),
                        health: Math.max(30, 100 - monsters.length * 15),
                        position,
                        height: Math.max(10, loc / 10),
                        monsters,
                        lastUpdated: Date.now()
                    };
                });
            }
            
            _hash_to_pos(filepath) {
                let h = 0;
                for (let i = 0; i < filepath.length; i++) {
                    h = filepath.charCodeAt(i) + ((h << 5) - h);
                }
                let x = (h % 20) * 15 - 150;
                let z = ((h / 20) % 20) * 15 - 150;
                return { x: parseFloat(x.toFixed(2)), z: parseFloat(z.toFixed(2)) };
            }
            
            _generate_monster(buildingId) {
                const errorTypes = ["Complexity Spike", "Security Leak", "Dead Code", "Dependency Hell", "UX Mismatch"];
                return {
                    id: `${buildingId}_monster_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                    type: errorTypes[Math.floor(Math.random() * errorTypes.length)],
                    message: `Threat detected near line ${Math.floor(Math.random() * 200) + 1}`,
                    severity: Math.floor(Math.random() * 10) + 1,
                    line: Math.floor(Math.random() * 200) + 1
                };
            }
            
            // ========== CROSS-TAB SYNC MAGIC ==========
            setupCrossTabSync() {
                window.addEventListener('storage', (e) => {
                    if (e.key === this.STORAGE_KEY && e.newValue) {
                        const newState = JSON.parse(e.newValue);
                        this.state = newState;
                        if (window.onCityStateUpdate) {
                            window.onCityStateUpdate(newState);
                        }
                    }
                    
                    if (e.key === this.SYNC_TRIGGER_KEY) {
                        this.updateUserPresence();
                    }
                });
            }
            
            startSyncPulse() {
                // Pulse every 5 seconds to show we're alive
                setInterval(() => {
                    this.updateUserPresence();
                    localStorage.setItem(this.SYNC_TRIGGER_KEY, Date.now().toString());
                    setTimeout(() => localStorage.removeItem(this.SYNC_TRIGGER_KEY), 100);
                }, 5000);
            }
            
            updateUserPresence() {
                this.state.users[this.userId] = {
                    lastSeen: Date.now(),
                    active: true
                };
                this.saveState();
            }
            
            // ========== STATE MANAGEMENT ==========
            saveState() {
                this.state.lastUpdated = Date.now();
                this.state.version = '1.0';
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state));
            }
            
            updateBuilding(buildingId, updates) {
                const buildingIndex = this.state.buildings.findIndex(b => b.id === buildingId);
                if (buildingIndex !== -1) {
                    this.state.buildings[buildingIndex] = {
                        ...this.state.buildings[buildingIndex],
                        ...updates,
                        lastUpdated: Date.now()
                    };
                    this.saveState();
                    return true;
                }
                return false;
            }
            
            addMonster(buildingId, monster) {
                const building = this.state.buildings.find(b => b.id === buildingId);
                if (building) {
                    building.monsters.push(monster);
                    building.health = Math.max(5, building.health - 10); // Health penalty
                    building.lastUpdated = Date.now();
                    this.saveState();
                    return true;
                }
                return false;
            }
            
            removeMonster(buildingId, monsterId) {
                const building = this.state.buildings.find(b => b.id === buildingId);
                if (building) {
                    building.monsters = building.monsters.filter(m => m.id !== monsterId);
                    building.health = Math.min(100, building.health + 15); // Health boost
                    building.lastUpdated = Date.now();
                    this.saveState();
                    return true;
                }
                return false;
            }
            
            getActiveUsers() {
                const now = Date.now();
                return Object.values(this.state.users).filter(user => 
                    user.lastSeen > now - 30000 // Active in last 30 seconds
                ).length;
            }
        }

        // ========== GAME ENGINE ==========
        const DECAY_INTERVAL = 10000; // 10 seconds
        const MONSTER_DECAY_RATE = 2.5;
        const CHAOS_SPAWN_CHANCE = 0.25;

        let persistence;
        let scene, camera, renderer, controls;
        let buildingMeshes = new Map();
        let currentBuildingId = null;

        const AGENT_SWARM = [
            'aFiREFLY Refactor', 'EquiLex Security', 'Vibe Coder Cleaner', 
            'Blue Sky Architect', 'ModMind Synthesizer', 'Quantum Debugger'
        ];

        function initGame() {
            persistence = new ModMindPersistence();
            
            // Set up global state update handler
            window.onCityStateUpdate = (newState) => {
                updateHUD(newState);
                renderCity3D(newState.buildings);
            };
            
            // Initial render
            updateHUD(persistence.state);
            initThreeJS();
            renderCity3D(persistence.state.buildings);
            startDecayLoop();
            setupAgentButtons();
            
            showInGameAlert('🚀 MODMIND HUB ONLINE - Client-Side Freedom Activated!', 'success');
        }

        function updateHUD(state) {
            const totalMonsters = state.buildings.reduce((sum, building) => sum + building.monsters.length, 0);
            const avgHealth = state.buildings.reduce((sum, building) => sum + building.health, 0) / state.buildings.length;
            const activeUsers = persistence.getActiveUsers();
            
            document.getElementById('fileCount').textContent = state.buildings.length;
            document.getElementById('monsterCount').textContent = totalMonsters;
            document.getElementById('userCount').textContent = activeUsers;
            document.getElementById('healthIndex').textContent = `${Math.round(avgHealth)}%`;
            
            document.getElementById('auth-status').textContent = 
                `🟢 ${activeUsers} Users Online | ${persistence.userId.substring(0, 8)}`;
        }

        function startDecayLoop() {
            setInterval(() => {
                let newMonstersSpawned = 0;
                
                persistence.state.buildings.forEach(building => {
                    // Health decay based on monster count
                    const decayMultiplier = building.monsters.length > 0 ? building.monsters.length : 1;
                    const newHealth = Math.max(5, building.health - (MONSTER_DECAY_RATE * decayMultiplier));
                    
                    // Chance to spawn new monster
                    const decayChance = CHAOS_SPAWN_CHANCE + (100 - building.health) / 200;
                    
                    if (Math.random() < decayChance) {
                        const newMonster = persistence._generate_monster(building.id);
                        persistence.addMonster(building.id, newMonster);
                        newMonstersSpawned++;
                    } else {
                        persistence.updateBuilding(building.id, { health: newHealth });
                    }
                });
                
                if (newMonstersSpawned > 0) {
                    showInGameAlert(`Chaos Loop: ${newMonstersSpawned} new threats spawned`, 'system');
                }
            }, DECAY_INTERVAL);
        }

        // ========== 3D RENDERING (your existing Three.js code) ==========
        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 150, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('app').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 200, 100);
            scene.add(directionalLight);

            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(1000, 1000);
            const groundMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x003300, 
                transparent: true, 
                opacity: 0.1 
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            animate();
        }

        function renderCity3D(buildings) {
            // Clear existing buildings
            buildingMeshes.forEach(mesh => scene.remove(mesh));
            buildingMeshes.clear();

            buildings.forEach(building => {
                const color = new THREE.Color();
                color.setHSL(building.health / 300, 0.8, 0.5);
                
                const geometry = new THREE.BoxGeometry(8, building.height, 8);
                const material = new THREE.MeshPhongMaterial({ 
                    color: color,
                    emissive: new THREE.Color(building.health / 100, 0, 0),
                    shininess: 30
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(building.position.x, building.height / 2, building.position.z);
                mesh.userData = { buildingId: building.id };
                
                scene.add(mesh);
                buildingMeshes.set(building.id, mesh);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // ========== UI INTERACTIONS ==========
        function setupAgentButtons() {
            co
